<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星野 · 角木蛟海报化形试作</title>
<style>body{margin:0;background:#070b0f;color:#c8d6d9;font:12px system-ui}#sky,#statue-particles{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}#sky{opacity:.5}.intro{position:fixed;top:24px;left:28px;z-index:4;pointer-events:none}.intro h1{font:30px serif;letter-spacing:.2em;color:#d0eaed;margin:0 0 12px}.intro p{font-size:11px;color:#819aa4;line-height:1.9}.controls{position:fixed;bottom:14px;left:20px;right:20px;padding:9px;background:#080e13ee;border:1px solid #31444d;z-index:5;display:flex;align-items:center;gap:7px;flex-wrap:wrap}button,a{color:#bfd7de;background:#0d1820;border:1px solid #3b555e;padding:8px;text-decoration:none;font:11px system-ui}output{margin-left:auto;color:#8fa9b4;font:11px monospace}[hidden]{display:none!important}</style>
<canvas id="sky" aria-hidden="true"></canvas><div class="intro"><h1>角木蛟</h1><p>海报主体 · 青蓝流尘<br>v21 基础，只修改角宿化形。<br>移动鼠标拨动粒子，点击播放查看汇聚与回归。</p></div>
<div class="controls"><button data-time=".65">亮星逸出</button><button data-time="1.7">流尘</button><button data-time="2.8">凝像</button><button data-time="5.6">成形</button><button data-time="10.4">回归</button><button id="wave">生成中指尖涟漪回放</button><button id="play">播放完整过程</button><a href="?canvas-fallback">Canvas 降级</a><output id="readout">准备海报粒子…</output></div>
<script type="module">
import {StatueStage} from './particle-effects.js?v=23';
const stage=new StatueStage(),item=await fetch('./data/jiao-poster.json').then(r=>r.json()),readout=document.querySelector('#readout'),sources=[{x:.38,y:.41},{x:.43,y:.54}];
function sky(){const c=document.querySelector('#sky');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');x.fillStyle='#0b1118';x.fillRect(0,0,c.width,c.height);for(let i=0;i<1200;i++){x.fillStyle=i%29?'#829eaf88':'#e1ce92';x.fillRect((i*.618034%1)*c.width,(i*.754878%1)*c.height,i%29?1:2,i%29?1:2);}x.strokeStyle='#d4ba6b55';x.beginPath();sources.forEach((p,i)=>{const px=p.x*c.width,py=p.y*c.height;if(i)x.lineTo(px,py);else x.moveTo(px,py);});x.stroke();for(const p of sources){x.fillStyle='#ead397';x.beginPath();x.arc(p.x*c.width,p.y*c.height,2.4,0,Math.PI*2);x.fill();}}sky();addEventListener('resize',sky);
let frozen=5.6,fixedNow=0,lastPointer=null;
function begin(seconds=null){stage.timeline.state='IDLE';stage.timeline.cooldownUntil=0;stage.start(item,performance.now(),sources);frozen=seconds;fixedNow=performance.now();if(seconds!==null)stage.timeline.started=stage.animationStarted=fixedNow-seconds*1000;paint(fixedNow);readout.dataset.ready='pending';requestAnimationFrame(()=>requestAnimationFrame(()=>{readout.dataset.ready='true';}));}
for(const b of document.querySelectorAll('[data-time]'))b.onclick=()=>begin(Number(b.dataset.time));document.querySelector('#play').onclick=()=>begin();document.querySelector('#wave').onclick=()=>{begin(2.8);stage.interactFingers([{finger:'index',x:.49,y:.43,strength:.9,motion:true}],fixedNow-400,{x:.5,y:.5});paint(fixedNow);};
document.addEventListener('pointermove',event=>{if(event.target.closest('.controls'))return;const now=performance.now(),x=event.clientX/innerWidth,y=event.clientY/innerHeight;if(frozen!==null){const shift=now-fixedNow;stage.timeline.started+=shift;stage.animationStarted+=shift;for(const r of stage.ripples)r.time+=shift;fixedNow=now;}const speed=lastPointer?Math.hypot(x-lastPointer.x,y-lastPointer.y)/Math.max(.016,(now-lastPointer.t)/1000):0;lastPointer={x,y,t:now};stage.interact(x,y,now,Math.min(1.2,speed*.9));paint(now);});
function paint(now){const s=stage.draw(null,now,innerWidth,innerHeight,{x:innerWidth*.4,y:innerHeight*.5});readout.textContent=`${s.state} · ${stage.renderer} · CPU ${stage.frameMs.toFixed(2)}ms`;Object.assign(readout.dataset,{state:s.state,renderer:stage.renderer,poster:String(stage.posterMode),ripples:String(stage.ripples.length),source:stage.lastRippleSource||'',error:stage.error||'',cpu:String(stage.frameMs)});}
function frame(now){paint(frozen===null?now:fixedNow);requestAnimationFrame(frame);}begin(5.6);requestAnimationFrame(frame);
</script></html>
