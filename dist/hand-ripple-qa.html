<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星野 · 手势涟漪链路验证</title>
<link rel="stylesheet" href="./experience.css?v=17">
<style>body{margin:0;background:#0a0e14;color:#dfd2ac;font:12px system-ui}#statue-particles{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}[hidden]{display:none!important}.experience-actions,.gesture-panel,.gesture-hud{display:none!important}.controls{position:fixed;left:18px;top:12px;right:18px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:9px;background:#0c1118;border:1px solid #8e7949;color:#dfcf9b}h1{font:15px serif;margin:0 15px 0 0}small{width:100%;color:#8e9dac}#readout{font:12px monospace;color:#ecd498;margin-left:auto}#sky{position:fixed;inset:0;opacity:.52}</style>
<canvas id="sky" aria-hidden="true"></canvas><main></main><div class="bottom-panel"></div><div class="controls"><h1>手势涟漪链路验证</h1><button id="gather">生成阶段</button><button id="hold">成形阶段</button><button id="slow-hand">回放缓慢移手 · 2 FPS</button><button id="jitter">回放静止抖动</button><output id="readout" role="status">准备中…</output><small>测试页使用模拟的 21 点手部数据，通过真实手势协调器与粒子渲染器回放；不申请摄像头，不代表真人识别实测。</small></div>
<script type="module">
import {initExperience} from './experience.js?v=17';
import {StatueStage} from './particle-effects.js?v=17';
import {describeHand} from './gesture-core.js?v=17';
const stage=new StatueStage();let callbacks,camera,locked=2.8,timer=null,mode='';
const experience=initExperience({selected:()=>({id:3,name:'房'}),blocked:()=>false,notice(){},stopNavigation(){},snapshot:()=>({}),restore(){},nearest:()=>3,mansionName:()=> '房',pan(){},emissionSources:()=>[{x:.4,y:.4},{x:.45,y:.5},{x:.47,y:.6},{x:.43,y:.7}]},{stageFactory:()=>stage,cameraFactory:(video,c)=>{callbacks=c;return camera={running:false,inferenceMs:500,async start(){this.running=true;c.onStatus('running','模拟手部输入 · 不申请摄像头');},stop(){this.running=false;c.onSample(null,performance.now(),null,0);}};}});
function sky(){const c=document.querySelector('#sky');c.width=innerWidth;c.height=innerHeight;const ctx=c.getContext('2d');ctx.fillStyle='#0b1118';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<1100;i++){ctx.fillStyle=i%13?'#afc3db66':'#f7d484';ctx.fillRect((i*.6180339%1)*c.width,(i*.7548776%1)*c.height,1.3,1.3);}}sky();addEventListener('resize',sky);
async function begin(seconds){clearInterval(timer);stage.timeline.state='IDLE';stage.timeline.cooldownUntil=0;callbacks.onSample(null,performance.now(),null,0);await document.querySelector('#morph-trigger').onclick();locked=seconds;mode='';stage.timeline.started=stage.animationStarted=performance.now()-seconds*1000;}
function landmarks(dx){const p=Array.from({length:21},()=>({x:.5+dx,y:.67,z:0}));p[0]={x:.5+dx,y:.72};for(const [i,mcp]of [5,9,13,17].entries()){const x=.35+i*.12+dx;p[mcp]={x,y:.52};p[mcp+1]={x,y:.32};p[mcp+2]={x,y:.17};p[mcp+3]={x,y:.04};}return p;}
function replay(jitter=false){clearInterval(timer);callbacks.onSample(null,performance.now(),null,0);mode=jitter?'jitter':'slow';let i=0;const emit=()=>{const p=landmarks(jitter?Math.sin(i)*.001:.04-i*.01);callbacks.onSample(describeHand(p,.96,1),performance.now(),null,1);if(++i>=7){clearInterval(timer);mode=(jitter?'jitter':'slow')+'-complete';}};emit();timer=setInterval(emit,500);}
document.querySelector('#gather').onclick=()=>begin(2.8);document.querySelector('#hold').onclick=()=>begin(5.4);document.querySelector('#slow-hand').onclick=()=>replay();document.querySelector('#jitter').onclick=()=>replay(true);
function draw(now){if(stage.busy){stage.timeline.started=stage.animationStarted=now-locked*1000;}experience.beforeFrame(now);experience.draw(null,now,innerWidth,innerHeight,{x:innerWidth*.5,y:innerHeight*.5},false);const r=document.querySelector('#readout');r.textContent=`${stage.timeline.state} · 手势涟漪 ${stage.handRippleCount||0} · ${stage.renderer}`;r.dataset.phase=stage.timeline.state;r.dataset.handRipples=String(stage.handRippleCount||0);r.dataset.replay=mode;requestAnimationFrame(draw);}begin(2.8);requestAnimationFrame(draw);
</script></html>
