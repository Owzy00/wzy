<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星野 · 手势涟漪链路验证</title>
<link rel="stylesheet" href="./experience.css?v=25">
<style>body{margin:0;background:#0a0e14;color:#dfd2ac;font:12px system-ui}#statue-particles{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}[hidden]{display:none!important}.experience-actions,.gesture-panel,.gesture-hud{display:none!important}.controls{position:fixed;left:18px;top:12px;right:18px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:9px;background:#0c1118;border:1px solid #8e7949;color:#dfcf9b}h1{font:15px serif;margin:0 15px 0 0}small{width:100%;color:#8e9dac}#readout{font:12px monospace;color:#ecd498;margin-left:auto}#sky{position:fixed;inset:0;opacity:.52}</style>
<canvas id="sky" aria-hidden="true"></canvas><main></main><div class="bottom-panel"></div><div class="controls"><h1>五指独立定位验证</h1><button id="gather">生成阶段</button><button id="hold">成形阶段</button><button id="finger-thumb">拇指晃动</button><button id="finger-index">食指晃动</button><button id="finger-middle">中指晃动</button><button id="finger-ring">无名指晃动</button><button id="finger-pinky">小指晃动</button><button id="all-fingers">晃动五指 · 各自定位</button><button id="move">整手移动 · 应为 0</button><button id="still">识别不动</button><button id="jitter">静止抖动</button><button id="freeze">涟漪定帧</button><output id="readout" role="status">准备中…</output><small>测试页以模拟 21 点手部数据按记录时间戳回放，经过真实协调器和渲染器；不申请摄像头，不代表真人识别实测。</small></div>
<script type="module">
import {initExperience} from './experience.js?v=25';
import {StatueStage} from './particle-effects.js?v=25';
import {describeHand,FINGER_TIPS} from './gesture-core.js?v=25';
document.addEventListener('pointermove',event=>{if(event.target.closest('.controls'))event.stopPropagation();},true);
const stage=new StatueStage();let callbacks,camera,locked=2.8,mode='',freeze=false,beats=[];
const experience=initExperience({selected:()=>({id:3,name:'房'}),blocked:()=>false,notice(){},stopNavigation(){},snapshot:()=>({}),restore(){},nearest:()=>3,mansionName:()=> '房',pan(){},emissionSources:()=>[{x:.4,y:.4},{x:.45,y:.5},{x:.47,y:.6},{x:.43,y:.7}]},{stageFactory:()=>stage,cameraFactory:(video,c)=>{callbacks=c;return camera={running:false,inferenceMs:500,async start(){this.running=true;c.onStatus('running','模拟手部输入 · 不申请摄像头');},stop(){this.running=false;c.onSample(null,performance.now(),null,0);}};}});
function sky(){const c=document.querySelector('#sky');c.width=innerWidth;c.height=innerHeight;const ctx=c.getContext('2d');ctx.fillStyle='#0b1118';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<1100;i++){ctx.fillStyle=i%13?'#afc3db66':'#f7d484';ctx.fillRect((i*.6180339%1)*c.width,(i*.7548776%1)*c.height,1.3,1.3);}}sky();addEventListener('resize',sky);
async function begin(seconds){stage.timeline.state='IDLE';stage.timeline.cooldownUntil=0;callbacks.onSample(null,performance.now(),null,0);await document.querySelector('#morph-trigger').onclick();locked=seconds;mode='';freeze=false;document.querySelector('#freeze').textContent='涟漪定帧';stage.timeline.started=stage.animationStarted=performance.now()-seconds*1000;}
function landmarks(){const p=Array.from({length:21},()=>({x:.5,y:.7,z:0}));p[0]={x:.5,y:.86};p[4]={x:.38,y:.56,z:0};for(const [i,mcp]of [5,9,13,17].entries()){const x=.44+i*.05;p[mcp]={x,y:.68};p[mcp+1]={x,y:.58};p[mcp+2]={x,y:.48};p[mcp+3]={x,y:.38};}return p;}
function replay(kind){
 const frames=[0,.012,.022,.028,.018,.005,0].map((n,i)=>[i*60,n]);
 const base=performance.now()-frames.at(-1)[0];callbacks.onSample(null,base-1,null,0);beats=[];
 for(const [t,amount]of frames){const i=t/60;
  const p=landmarks(),ids=Object.hasOwn(FINGER_TIPS,kind)?[FINGER_TIPS[kind]]:kind==='all'?Object.values(FINGER_TIPS):[];
  for(const id of ids)p[id].x+=amount;
  if(kind==='move')for(const q of p){q.x+=amount;q.y+=amount*.2;}
  if(kind==='jitter')for(const id of Object.values(FINGER_TIPS)){p[id].x+=Math.sin(i)*.001;p[id].y+=Math.cos(i)*.001;}
  const before=stage.handRippleCount||0;callbacks.onSample(describeHand(p,.96,1),base+t,null,1);if((stage.handRippleCount||0)>before)beats.push(t);
 }
 mode=kind+'-complete';
}
document.querySelector('#gather').onclick=()=>begin(2.8);document.querySelector('#hold').onclick=()=>begin(5.4);
for(const finger of Object.keys(FINGER_TIPS))document.querySelector('#finger-'+finger).onclick=()=>replay(finger);
for(const [id,kind]of [['all-fingers','all'],['move','move'],['still','still'],['jitter','jitter']])document.querySelector('#'+id).onclick=()=>replay(kind);
document.querySelector('#freeze').onclick=()=>{freeze=!freeze;document.querySelector('#freeze').textContent=freeze?'恢复动效':'涟漪定帧';};
function draw(now){if(freeze)for(const r of stage.ripples)r.time=now-350;if(stage.busy){stage.timeline.started=stage.animationStarted=now-locked*1000;}experience.beforeFrame(now);experience.draw(null,now,innerWidth,innerHeight,{x:innerWidth*.5,y:innerHeight*.5},false);const r=document.querySelector('#readout');r.textContent=stage.timeline.state+' · 涟漪位置 '+stage.ripples.filter(q=>q.finger).length+' / 5 · 累计 '+(stage.handRippleCount||0)+' · '+stage.renderer;r.dataset.phase=stage.timeline.state;for(const finger of Object.keys(FINGER_TIPS))r.dataset[finger+'Ripples']=String(stage.fingerRippleCount?.[finger]||0);r.dataset.handRipples=String(stage.handRippleCount||0);r.dataset.replay=mode;r.dataset.sources=String(stage.ripples.filter(q=>q.finger).length);requestAnimationFrame(draw);}begin(2.8);requestAnimationFrame(draw);
</script></html>
