<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星野 · 动效分段验证</title>
<style>body{margin:0;background:#040507;color:#d7c9aa;font:12px system-ui}#statue-particles{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}[hidden]{display:none!important}.controls{position:fixed;bottom:12px;left:12px;right:12px;z-index:5;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#07090ce8;padding:10px}button,select{background:#11151b;border:1px solid #746849;color:#dfcc9b;padding:8px}a{color:#b6bfcc}#readout{font:11px monospace;margin-left:auto}h1{position:fixed;left:22px;top:8px;font:16px serif;font-weight:400;z-index:5}</style>
<h1>星野 · 动效分段验证</h1><div class="controls"><select id="mansion" aria-label="测试星宿"></select><button data-time="1.3">卷云 · 1.3s</button><button data-time="1.9">卷动 · 1.9s</button><button data-time="2.8">凝像 · 2.8s</button><button data-time="5.2">成形 · 5.2s</button><button data-time="10.4">散开 · 10.4s</button><button id="ripple">涟漪 · 0.45s</button><button id="play">播放实际时间</button><a href="?canvas-fallback">Canvas 降级验证</a><output id="readout">载入中…</output></div>
<script type="module">
import {StatueStage} from './particle-effects.js?v=14';
const stage=new StatueStage(),pack=await fetch('./data/statues.json').then(r=>r.json()),select=document.querySelector('#mansion');
for(const item of pack.items){const option=document.createElement('option');option.value=item.id;option.textContent=item.title;select.append(option);}select.value='3';
let fixedTime=null,fixedNow=0;
function begin(seconds=null){stage.timeline.state='IDLE';stage.timeline.cooldownUntil=0;stage.start(pack.items[Number(select.value)],performance.now());fixedTime=seconds;fixedNow=performance.now();stage.lastDraw=0;if(seconds!==null)stage.timeline.started=stage.animationStarted=fixedNow-seconds*1000;paint(fixedNow);document.querySelector('#readout').dataset.ready='pending';requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector('#readout').dataset.ready=String(seconds)));}
for(const button of document.querySelectorAll('[data-time]'))button.onclick=()=>begin(Number(button.dataset.time));select.onchange=()=>begin(fixedTime??1.3);document.querySelector('#play').onclick=()=>begin();document.querySelector('#ripple').onclick=()=>{begin(5.65);stage.interact(.50,.43,fixedNow-450,1.25);paint(fixedNow);};
let previousPointer=null;
document.addEventListener('pointermove',event=>{
 const now=performance.now(),x=event.clientX/innerWidth,y=event.clientY/innerHeight;
 const speed=previousPointer?Math.hypot(x-previousPointer.x,y-previousPointer.y)/Math.max(.016,(now-previousPointer.time)/1000):0;previousPointer={x,y,time:now};
 if(event.target.closest('.controls')||stage.timeline.state!=='HOLDING')return;
 if(fixedTime!==null){const shift=now-fixedNow;stage.timeline.started+=shift;stage.animationStarted+=shift;for(const r of stage.ripples)r.time+=shift;fixedTime=null;}
 stage.interact(x,y,now,Math.min(1.2,speed*.9));
});
function paint(time){const sample=stage.draw(null,time,innerWidth,innerHeight,{x:innerWidth*.5,y:innerHeight*.5},matchMedia('(prefers-reduced-motion:reduce)').matches);document.querySelector('#readout').textContent=`${sample.state} · ${stage.renderer} · CPU ${stage.frameMs.toFixed(2)}ms`;}function draw(now){paint(fixedTime===null?now:fixedNow);requestAnimationFrame(draw);}begin(1.3);requestAnimationFrame(draw);
</script></html>
