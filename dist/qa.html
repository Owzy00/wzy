<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>星野 · 模型自检</title><style>body{background:#080b0f;color:#dbc997;font:16px sans-serif;padding:40px}button{padding:16px;background:#17202c;color:#efdfb3;border:1px solid #735f3c}pre{white-space:pre-wrap;line-height:1.7}</style><h1>MediaPipe 本地模型自检</h1><p>使用空白图像测试默认与兼容识别，不申请或使用摄像头。</p><button id="run">运行模型自检</button><button id="compat">运行兼容识别自检</button><pre id="result" role="status">尚未运行</pre><script type="module">
import {createHandWorker,modelLocation,createMainHandDetector} from './gesture-camera.js';
document.querySelector('#run').onclick=()=>{const result=document.querySelector('#result');result.textContent='正在加载本地模型…';const worker=createHandWorker(),start=performance.now(),timer=setTimeout(()=>{worker.terminate();result.textContent='FAIL: 初始化或推理超时';},45000);worker.onmessage=async({data})=>{if(data.type==='ready'){result.textContent='模型已初始化，正在运行空白帧…';const c=new OffscreenCanvas(480,360),ctx=c.getContext('2d');ctx.fillStyle='#101010';ctx.fillRect(0,0,480,360);const bitmap=await createImageBitmap(c);worker.postMessage({type:'frame',bitmap,timestamp:performance.now()},[bitmap]);}else if(data.type==='result'){clearTimeout(timer);const report={pass:data.handCount===0,handCount:data.handCount,inferenceMs:data.inferenceMs,totalMs:performance.now()-start};result.textContent=(report.pass?'PASS':'FAIL')+'\n'+JSON.stringify(report,null,2);document.documentElement.dataset.modelTest=JSON.stringify(report);worker.terminate();}else if(data.type==='error'){clearTimeout(timer);result.textContent='FAIL: '+data.message;worker.terminate();}};worker.onerror=e=>{clearTimeout(timer);result.textContent='FAIL: '+e.message;};worker.postMessage({type:'init',...modelLocation()});};
document.querySelector('#compat').onclick=async()=>{const result=document.querySelector('#result');result.textContent='正在初始化兼容识别…';let detector;try{const start=performance.now();detector=await createMainHandDetector();const canvas=new OffscreenCanvas(360,270),ctx=canvas.getContext('2d');ctx.fillStyle='#101010';ctx.fillRect(0,0,360,270);const frame=await createImageBitmap(canvas);let data;const inference=performance.now();try{data=detector.detectForVideo(frame,inference);}finally{frame.close();}const report={pass:data.landmarks.length===0,backend:'main',hands:data.landmarks.length,inferenceMs:performance.now()-inference,totalMs:performance.now()-start};result.textContent=(report.pass?'PASS':'FAIL')+'\n'+JSON.stringify(report,null,2);document.documentElement.dataset.compatTest=JSON.stringify(report);}catch(error){result.textContent='FAIL: '+error.message;}finally{detector?.close();}};
</script></html>
