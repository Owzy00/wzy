<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星野 · 亢金龙三维粒子预览</title>
<style>body{margin:0;background:#080c10;color:#b8d7d3;font:13px system-ui}#sky,#statue-particles{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}#sky{opacity:.48}.head{position:fixed;top:20px;left:24px;z-index:2;max-width:240px;pointer-events:none}h1{font:30px serif;letter-spacing:.2em;color:#e8f7ec;margin:0 0 12px}p{line-height:1.8;font-size:12px}.controls{position:fixed;bottom:16px;left:20px;right:20px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#080f14e8;padding:10px;border:1px solid #23403e}button,a{background:#0e1b20;color:#bfe7df;border:1px solid #365b59;padding:8px;text-decoration:none;font:12px system-ui}#readout{font:11px monospace;margin-left:auto}[hidden]{display:none!important}</style>
<canvas id="sky" aria-hidden="true"></canvas><div class="head"><h1>亢金龙</h1><p>用户 STL · 三维表面粒子<br>青绿 / 冰蓝 / 淡金<br>拖动查看背面，移鼠标泛起涟漪。<br>这里只演示亢宿的真实三维素材。</p></div>
<div class="controls"><button id="front">正面</button><button id="side">侧面 90°</button><button id="back">背面 180°</button><button id="gather">生成中</button><button id="wave">指尖涟漪回放</button><button id="play">完整化形与旋转</button><a href="?canvas-fallback">Canvas 降级</a><output id="readout">载入模型…</output></div>
<script type="module">
import {StatueStage} from './particle-effects.js?v=22';
const item=await fetch('./data/kang-3d.json').then(r=>r.json()),stage=new StatueStage(),readout=document.querySelector('#readout');
const sky=document.querySelector('#sky');function skyDraw(){sky.width=innerWidth;sky.height=innerHeight;const c=sky.getContext('2d');c.fillStyle='#081017';c.fillRect(0,0,sky.width,sky.height);for(let i=0;i<1500;i++){c.fillStyle=i%27?'#a0c1d47a':'#f6e3ad';const x=(i*.618034%1)*sky.width,y=(i*.754878%1)*sky.height;c.fillRect(x,y,i%27?1:2,i%27?1:2);}c.strokeStyle='#8fbac217';for(let i=1;i<6;i++){c.beginPath();c.ellipse(sky.width*.52,sky.height*.5,sky.height*(.13+i*.09),sky.height*(.18+i*.1),.2,0,Math.PI*2);c.stroke();}}skyDraw();addEventListener('resize',skyDraw);
let frozen=5.6,fixedNow=performance.now();const sources=[{x:.37,y:.36},{x:.41,y:.43},{x:.39,y:.56},{x:.35,y:.65}];
function begin(seconds=5.6,yaw=0){stage.timeline.state='IDLE';stage.timeline.cooldownUntil=0;stage.start(item,performance.now(),sources);frozen=seconds;fixedNow=performance.now();if(seconds!==null){stage.timeline.started=stage.animationStarted=fixedNow-seconds*1000;stage.rotationOffset.yaw=yaw-Math.max(0,seconds-2)*.28;}readout.dataset.ready='pending';paint(fixedNow);requestAnimationFrame(()=>{readout.dataset.ready='true';});}
document.querySelector('#front').onclick=()=>begin(5.6,0);document.querySelector('#side').onclick=()=>begin(5.6,Math.PI/2);document.querySelector('#back').onclick=()=>begin(5.6,Math.PI);document.querySelector('#gather').onclick=()=>begin(2.8,.2);document.querySelector('#play').onclick=()=>begin(null);
document.querySelector('#wave').onclick=()=>{begin(5.6,.25);stage.interactFingers([{finger:'index',x:.48,y:.42,strength:.9,motion:true}],fixedNow-350,{x:.5,y:.5});paint(fixedNow);};
let dragging=false,previous=null;document.addEventListener('pointerdown',event=>{if(event.target.closest('.controls'))return;dragging=stage.beginRotation(event.clientX/innerWidth,event.clientY/innerHeight);});document.addEventListener('pointerup',()=>{dragging=false;stage.endRotation();});document.addEventListener('pointermove',event=>{if(event.target.closest('.controls'))return;const now=performance.now(),x=event.clientX/innerWidth,y=event.clientY/innerHeight;if(frozen!==null){const shift=now-fixedNow;stage.timeline.started+=shift;stage.animationStarted+=shift;for(const r of stage.ripples)r.time+=shift;fixedNow=now;}const speed=previous?Math.hypot(x-previous.x,y-previous.y)/Math.max(.016,(now-previous.t)/1000):0;previous={x,y,t:now};if(dragging)stage.dragRotation(x,y);stage.interact(x,y,now,Math.min(1.2,speed));paint(now);});
function paint(now){const sample=stage.draw(null,now,innerWidth,innerHeight,{x:innerWidth*.4,y:innerHeight*.5});readout.textContent=`${sample.state} · ${stage.renderer} · ${item.count.toLocaleString()} 表面点 · CPU ${stage.frameMs.toFixed(2)}ms · yaw ${(stage.yaw*180/Math.PI).toFixed(0)}°`;readout.dataset.kind=item.kind;readout.dataset.yaw=String(stage.yaw);readout.dataset.renderer=stage.renderer;readout.dataset.ripples=String(stage.ripples.length);readout.dataset.state=sample.state;readout.dataset.error=stage.error||'';readout.dataset.cpu=String(stage.frameMs);}
function frame(now){paint(frozen===null?now:fixedNow);requestAnimationFrame(frame);}begin();requestAnimationFrame(frame);
</script></html>
